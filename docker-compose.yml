services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
      POSTGRES_DB: sentinelops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://siem:siem@db:5432/sentinelops
      # OPENAI_API_KEY: ""   # optional — enables LLM analyst fallback
    ports:
      - "8000:8000"

volumes:
  pgdata:
