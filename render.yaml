# Render.com blueprint — one-click deploy (https://render.com/docs/blueprint-spec)
# Runs on SQLite (auto-seeded on boot) so it deploys with zero database setup.
# For persistent storage, set DATABASE_URL to a Postgres connection string
# (e.g. a free Neon database) in the Render dashboard.
services:
  - type: web
    name: sentinelops-siem
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      - key: ENV
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
